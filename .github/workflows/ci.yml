name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Reproducible, warning-free builds. Unused features are a review finding, not
  # a warning to scroll past.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy, all targets, all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      # The fuzz package is excluded from the workspace, so `--workspace` never
      # linted it and a clippy error sat in `fuzz_netlink_event` unnoticed. It
      # lints on stable even though its targets need nightly to build.
      - name: clippy the fuzz package
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: doc tests
        run: cargo test --workspace --doc

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: build on the minimum supported Rust version
        run: cargo check --workspace --all-targets
      - name: test on the minimum supported Rust version
        run: cargo test --workspace

  policy:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
      # Same reason as cargo-fuzz: the audit step was failing on
      # `no such command: audit`, so the job reported a failure that was not about
      # an advisory, and a job that cannot install its tool is a job that is not
      # testing anything.
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: audit
        run: cargo audit --deny warnings

  docs:
    name: documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_vrrp_ipv4_packet
          - fuzz_vrrp_ipv6_packet
          - fuzz_vrrp_round_trip
          - fuzz_config_document
          - fuzz_check_response
          - fuzz_netlink_event
          - fuzz_control_request
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # `cargo install --locked` rather than a prebuilt-binary action: the action
      # resolved to nothing and every target failed on `no such command: fuzz`,
      # which is a green-looking job that checked nothing.
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # `+nightly` explicitly, at every call. cargo-fuzz compiles through
      # `-Zsanitizer`, which stable refuses, and it selected stable anyway even
      # though this job installs nightly as the default -- so relying on the
      # job-level toolchain is what made every target fail on
      # "the option `Z` is only accepted on the nightly compiler". The toolchain
      # that does the sanitizing is named where the sanitizing happens.
      - name: build the target
        run: cargo +nightly fuzz build ${{ matrix.target }}
      # A smoke run, not a campaign. Its purpose is to prove the target builds
      # under the sanitizer and that its assertions hold on fresh input, so a
      # regression in a parser contract fails the build rather than being found
      # in a later campaign. A failure uploads the reproducer as an artifact.
      - name: run for 60 seconds
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60 -rss_limit_mb=2560
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifact-${{ matrix.target }}
          path: fuzz/artifacts

  netlink:
    name: netlink against a real kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Netlink backend is `cfg(target_os = "linux")`, so the matrix job
      # above compiles it but does not run it. This job needs CAP_NET_ADMIN to
      # create the dummy interface the tests use.
      - name: netlink tests
        run: sudo -E env "PATH=$PATH" cargo test -p highland-net --features netlink-tests

  # The two-node suite builds two namespaces and a bridge, starts a daemon in
  # each, and asserts that the address moves within Master_Down_Interval. That
  # needs CAP_ADMIN and namespaces, so the job runs privileged and installs
  # iproute2. The kernel tests on the host have no namespace to play in.
  two-node:
    name: two-node failover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install test tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iproute2 curl
      # The workspace first, because the operator tests drive the `highland`
      # binary, and cargo does not build another package's binaries. The local gate
      # in `scripts/linux-tests.sh` does this; the job did not, so the CLI tests
      # failed on a missing binary rather than on anything about Highland.
      - name: build the workspace
        run: cargo build --workspace
      - name: netlink against a real kernel
        run: sudo -E env "PATH=$PATH" cargo test -p highland-net --features netlink-tests
      # One test at a time: each of these builds a bridge and a pair of
      # namespaces, and the assertions are about elapsed time, so running several
      # at once has them competing for the same CPU.
      - name: two nodes, one segment, a VIP that moves
        run: sudo -E env "PATH=$PATH" cargo test -p highland-daemon --features netlink-tests -- --test-threads=1
      - name: an operator can read the node and stop it
        run: sudo -E env "PATH=$PATH" cargo test -p highland-daemon --features netlink-tests --test cli

  # The chaos scenarios of SPEC.md 21.5: loss, reordering, duplication, a
  # one-way partition, a link flap, and a frozen process, each asserted for
  # bounded recovery and bounded event volume. They need the same namespaces and
  # the same bridge as the failover suite, so they run here rather than in a job
  # of their own.
  # Keepalived is the implementation interoperability is tested against. It
  # found a real protocol defect: an IPv4 checksum scope that no other
  # implementation agreed with.
  interop:
    name: interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install test tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iproute2 keepalived
      - name: highland and keepalived, both directions
        run: sudo -E env "PATH=$PATH" cargo test -p highland-daemon --features netlink-tests --test interop -- --test-threads=1

  chaos:
    name: chaos scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install test tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iproute2
      - name: a segment with faults on it
        run: sudo -E env "PATH=$PATH" cargo test -p highland-daemon --features netlink-tests --test chaos -- --test-threads=1
