name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Reproducible, warning-free builds. Unused features are a review finding, not
  # a warning to scroll past.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy, all targets, all features
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: doc tests
        run: cargo test --workspace --doc

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: build on the minimum supported Rust version
        run: cargo check --workspace --all-targets
      - name: test on the minimum supported Rust version
        run: cargo test --workspace

  policy:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: audit
        run: cargo audit --deny warnings

  docs:
    name: documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_vrrp_ipv4_packet
          - fuzz_vrrp_ipv6_packet
          - fuzz_config_document
          - fuzz_check_response
          - fuzz_netlink_event
          - fuzz_control_request
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz
      - name: build the target
        run: cargo fuzz build ${{ matrix.target }}
      # A smoke run, not a campaign. Its purpose is to prove the target builds
      # under the sanitizer and that its assertions hold on fresh input, so a
      # regression in a parser contract fails the build rather than being found
      # in a later campaign. A failure uploads the reproducer as an artifact.
      - name: run for 60 seconds
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -rss_limit_mb=2560
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifact-${{ matrix.target }}
          path: fuzz/artifacts

  netlink:
    name: netlink against a real kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Netlink backend is `cfg(target_os = "linux")`, so the matrix job
      # above compiles it but does not run it. This job needs CAP_NET_ADMIN to
      # create the dummy interface the tests use.
      - name: netlink tests
        run: sudo -E env "PATH=$PATH" cargo test -p highland-net --features netlink-tests

  # Network-namespace tests need a purpose-built topology on both sides. They
  # are enabled by the `netns-tests` feature once Milestone 4 lands the harness
  # (SPEC.md, `R-01`).
  netns:
    name: network namespaces
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo cargo test --workspace --features netns-tests
