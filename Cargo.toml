[workspace]
resolver = "3"
members = [
    "crates/highland-core",
    "crates/highland-vrrp",
    "crates/highland-net",
    "crates/highland-checks",
    "crates/highland-config",
    "crates/highland-observe",
    "crates/highland-control",
    "crates/highland-daemon",
    "crates/highland-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/highland-rs/highland"
homepage = "https://github.com/highland-rs/highland"
authors = ["The Highland contributors"]
categories = ["network-programming"]
keywords = ["vrrp", "high-availability", "failover", "networking"]
publish = false

[workspace.dependencies]
highland-core = { path = "crates/highland-core", version = "0.1.0" }
highland-vrrp = { path = "crates/highland-vrrp", version = "0.1.0" }
highland-net = { path = "crates/highland-net", version = "0.1.0" }
highland-checks = { path = "crates/highland-checks", version = "0.1.0" }
highland-config = { path = "crates/highland-config", version = "0.1.0" }
highland-observe = { path = "crates/highland-observe", version = "0.1.0" }
highland-control = { path = "crates/highland-control", version = "0.1.0" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tokio = { version = "1.47", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    "net",
    "io-util",
    "fs",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
proptest = "1.6"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The repository is a library-first project. The lints below fight the domain
# vocabulary (for example `highland_core::state::State`) without catching
# defects, so they are allowed deliberately.
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Enum variants are the domain's own vocabulary and read better without a
# redundant prefix once the enum name is in scope.
enum_variant_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
lto = "thin"
