[package]
name = "highland-checks"
description = "Native health checks for Highland, with thresholds, weights, and bounded execution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
publish.workspace = true

[features]
default = []
# Arbitrary command execution. Off by default and deliberately awkward to
# enable, because it turns a configuration file into code execution
# (SPEC.md, `R-06`, `S-07`).
command-checks = []

[dependencies]
highland-core.workspace = true
thiserror.workspace = true
# The probes are asynchronous and the scheduler bounds them, which is the whole
# of `R-05`: a check that occupies a runtime worker while it waits on a socket is
# a check that can stop a node's state machine from running.
tokio = { workspace = true, features = ["net", "rt", "time", "sync", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }

[lints]
workspace = true
