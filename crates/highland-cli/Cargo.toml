[package]
name = "highland-cli"
description = "The administrative command-line interface for Highland."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
publish.workspace = true

[[bin]]
# The command operators type. The crate keeps the name `highland-cli` because
# that is what the dependency graph and `SPEC.md` §9.9 refer to, but a binary
# called `highland-cli` is not what a package manager installs onto a PATH, and
# the shipped systemd unit already expects `/usr/bin/highland`.
name = "highland"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
highland-config.workspace = true
highland-control.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
