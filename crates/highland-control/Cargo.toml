[package]
name = "highland-control"
description = "The local administrative control API for Highland."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "time", "fs", "sync", "macros"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# Resolving a group name for the socket's ownership, and the socket's mode.
nix = { workspace = true, features = ["fs", "user"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
