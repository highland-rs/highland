[package]
name = "highland-daemon"
description = "The Highland VRRP failover daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
publish.workspace = true

[features]
default = []
# Mirrors the highland-checks feature so the daemon can report whether command
# checks are available in this build (`V-21`).
command-checks = ["highland-checks/command-checks"]
# Runs the tests that build namespaces and move a real address. They need
# `CAP_NET_ADMIN` and `CAP_NET_RAW`; see tests/two_node.rs.
netlink-tests = ["highland-net/netlink-tests"]

[dependencies]
anyhow.workspace = true
highland-config.workspace = true
highland-control.workspace = true
highland-checks.workspace = true
highland-core.workspace = true
highland-net.workspace = true
highland-observe.workspace = true
highland-vrrp.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
highland-vrrp.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
