[package]
name = "highland-net"
description = "Linux interface, address, and socket operations for Highland, behind mockable traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
publish.workspace = true

[features]
default = []
# The Linux backend. It is on by default because Highland is a Linux product and
# an absent backend is not a useful default, but the code it selects is
# `cfg(target_os = "linux")` regardless, so the crate still builds elsewhere with
# an `UnsupportedBackend`.
netlink = []
# Runs the Netlink tests against a real kernel. Off by default because they need
# `CAP_NET_ADMIN` and a Linux host; see crates/highland-net/tests/netlink.rs.
netlink-tests = []

# The Netlink stack is Linux-only. `rtnetlink` pulls in `netlink-sys`, which
# references `libc::PF_NETLINK`, `libc::SOCK_CLOEXEC`, and `libc::sockaddr_nl`
# without cfg-gating them, so declaring it unconditionally would break
# `cargo test --workspace` on macOS. See docs/adr/ADR-0003-netlink-library.md.

[dependencies]
futures-util.workspace = true
highland-vrrp.workspace = true
libc.workspace = true
nix.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The feature is named `tokio_socket`, not `tokio`, and it is the one that
# selects the asynchronous socket type. Verified against the crate's own
# `Cargo.toml` rather than assumed.
rtnetlink = { version = "0.23", features = ["tokio_socket"] }
# `Type::RAW` and an arbitrary IP protocol number both need the `all` feature:
# VRRP is IP protocol 112, which has no constant.
socket2 = { version = "0.6", features = ["all"] }
tokio = { workspace = true, features = ["net", "io-util", "rt", "time"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Present only so that the unsupported backend has the same shape everywhere.
tokio = { workspace = true, features = ["net", "io-util", "rt", "time"] }

[dev-dependencies]
futures-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
