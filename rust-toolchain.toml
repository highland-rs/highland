# Toolchain used for local development and for continuous integration.
#
# The workspace MSRV is declared as `workspace.package.rust-version` in
# `Cargo.toml`. This file pins the toolchain used to *build* the project, not
# the oldest toolchain it supports. See `CONTRIBUTING.md`.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
